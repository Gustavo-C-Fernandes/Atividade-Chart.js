<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chartjs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="display: flex; flex-direction: row-reverse;">

    <div style="position: relative; height: 65vh; width: 45vw;">
        <canvas id="myChart1"></canvas>
    </div>

    <div style="position: relative; height: 65vh; width: 45vw;">
        <canvas id="myChart2"></canvas>
    </div>

    <script>
        // ---------- Gráfico 1 (barras) ----------
        const labels = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho'];

        const data = {
            labels: labels,
            datasets: [
                {
                    label: 'temperatura média',
                    data: [22, 24, 27, 23, 20, 18],
                    backgroundColor: 'green',
                    borderColor: 'green',
                    borderWidth: 2
                },
                {
                    label: 'umidade média',
                    data: [90, 89, 93, 87, 88, 82],
                    backgroundColor: 'darkred',
                    borderColor: 'cyan',
                    borderWidth: 2
                }
            ]
        };

        const config = {
            type: 'bar',
            data: data
        };

        const myChart1 = new Chart(
            document.getElementById('myChart1'),
            config
        );

        // ---------- Gráfico 2 (linhas) ----------
        const labels2 = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

        const data2 = {
            labels: labels2,
            datasets: [
                {
                    label: 'temperatura',
                    data: [30, 29, 28, 25, 22, 23],
                    fill: false,
                    borderColor: 'darkred',
                    backgroundColor: 'darkred',
                    tension: 0.1
                },
                {
                    label: 'umidade',
                    data: [80, 82, 80, 85, 80, 83],
                    fill: false,
                    borderColor: 'darkblue',
                    backgroundColor: 'darkblue',
                    tension: 0.1
                }
            ]
        };

        const config2 = {
            type: 'line',
            data: data2
        };

        const myChart2 = new Chart(
            document.getElementById('myChart2'),
            config2
        );
    </script>

</body>

</html>
